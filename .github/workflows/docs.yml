on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: Check SDK documentation

jobs:
  build:
    name: Checks if the SDK docs is updated
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lazydocs requests
    - name: Check api docs
      run: |
        python3 setup.py install
        lazydocs --src-base-url="https://github.com/absmach/supermq-sdk-py/blob/main/" --overview-file="README.md" --output-path="tmp/docs" magistrala
        DOCS=docs/*.md
        for filename in $DOCS; do
          echo "Comparing $filename with tmp/$filename"
          if ! cmp -b $filename tmp/$filename; then
            echo "Docs for $filename are out of sync!"
            exit 1
          fi
        done